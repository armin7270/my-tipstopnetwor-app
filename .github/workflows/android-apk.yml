name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The hosted runner already ships the Android SDK. The old
      # android-actions/setup-android action is no longer usable because it tries
      # to install the retired "tools" package, so we only add what we need.
      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR="$(find "$SDK_ROOT" -path '*/cmdline-tools/*/bin/sdkmanager' | head -n 1)"
          echo "Using $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
          ls "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools"

      - name: Install web dependencies
        run: npm ci

      - name: Build web bundle for the WebView
        run: npm run build:android

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/release.jks

      - name: Assemble signed release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          OBSIDIAN_KEYSTORE: ${{ github.workspace }}/android/release.jks
          OBSIDIAN_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          OBSIDIAN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OBSIDIAN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Assemble debug APK (no signing secrets configured)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect artifacts
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          find android/app/build/outputs/apk -name '*.apk' | while read -r apk; do
            case "$apk" in
              *debug*) NAME="LiquidObsidian-${VERSION}-universal-debug.apk" ;;
              *)       NAME="LiquidObsidian-${VERSION}-universal.apk" ;;
            esac
            cp "$apk" "release/$NAME"
          done
          cd release && sha256sum *.apk > SHA256SUMS.txt && ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: liquid-obsidian-apk
          path: release/*
          retention-days: 30

      - name: Publish GitHub Release
        # Only signed builds are attached to a release; an unsigned/debug fallback
        # would install fine but must not be mistaken for a distributable build.
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.apk
            release/SHA256SUMS.txt
          generate_release_notes: true
